name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --allowedTools
            "Bash(docker compose*)"
            "Bash(docker logs*)"
            "Bash(docker ps*)"
            "Bash(docker exec*)"
            "Bash(mysql -h 127.0.0.1*)"
            "Bash(psql -h 127.0.0.1*)"
            "Bash(curl*)"
            "Bash(git diff*)"
            "Bash(git log*)"
            "Bash(git status*)"
            "Bash(git show*)"
            Read
            Glob
            Grep
          prompt: |
            Review this PR following the guidelines in REVIEW.md.

            1. Analyze changed files to determine which profiles need testing
            2. For Docker/infrastructure changes: run functional tests as documented
            3. For documentation changes: verify accuracy
            4. For all changes: check if docs need updates

            Report results as specified in REVIEW.md.


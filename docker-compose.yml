# StarRocks MySQL CDC Demo
# BE 모드: docker compose --profile be up -d
# CN 모드: docker compose --profile cn up -d

services:
  # ===========================================
  # MySQL (공통 서비스)
  # ===========================================
  mysql:
    image: mysql:8.0
    container_name: mysql
    profiles: ["be", "cn", "risingwave"]
    environment:
      MYSQL_ROOT_PASSWORD: "starrocks_demo_pw1#"
      MYSQL_DATABASE: demo_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - starrocks-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pstarrocks_demo_pw1#"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ===========================================
  # MySQL Init (테이블이 없으면 자동 생성)
  # ===========================================
  mysql-init:
    image: mysql:8.0
    container_name: mysql-init
    profiles: ["be", "cn", "risingwave"]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - starrocks-net
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Checking if products table exists..."
        if ! mysql -h mysql -u root -pstarrocks_demo_pw1# -e "SELECT 1 FROM demo_db.products LIMIT 1" 2>/dev/null; then
          echo "Products table not found. Running init script..."
          mysql -h mysql -u root -pstarrocks_demo_pw1# --default-character-set=utf8mb4 < /scripts/mysql-init.sql
          echo "Init script completed."
        else
          echo "Products table already exists. Skipping init."
        fi
        echo "Checking if orders table exists..."
        if ! mysql -h mysql -u root -pstarrocks_demo_pw1# -e "SELECT 1 FROM demo_db.orders LIMIT 1" 2>/dev/null; then
          echo "Orders table not found. Running orders init script..."
          mysql -h mysql -u root -pstarrocks_demo_pw1# --default-character-set=utf8mb4 < /scripts/mysql-orders-init.sql
          echo "Orders init script completed."
        else
          echo "Orders table already exists. Skipping orders init."
        fi
    restart: "no"

  # ===========================================
  # StarRocks Frontend - BE 모드 (Shared-Nothing)
  # ===========================================
  starrocks-fe-be:
    image: starrocks/fe-ubuntu:3.5-latest
    hostname: starrocks-fe
    container_name: starrocks-fe
    profiles: ["be"]
    user: root
    command:
      - /bin/bash
      - -c
      - |
        /opt/starrocks/fe/bin/start_fe.sh --host_type FQDN
    ports:
      - "8030:8030"
      - "9020:9020"
      - "9030:9030"
    volumes:
      - fe_meta:/opt/starrocks/fe/meta
      - fe_log:/opt/starrocks/fe/log
    networks:
      - starrocks-net
      - rill-isolated-net
    healthcheck:
      test: 'mysql -u root -p"starrocks_demo_pw1#" -h starrocks-fe -P 9030 -e "show frontends\G" 2>/dev/null |grep "Alive: true" || mysql -u root -h starrocks-fe -P 9030 -e "show frontends\G" |grep "Alive: true"'
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # ===========================================
  # StarRocks Backend (BE 모드 전용)
  # ===========================================
  starrocks-be:
    image: starrocks/be-ubuntu:3.5-latest
    hostname: starrocks-be
    container_name: starrocks-be
    profiles: ["be"]
    user: root
    depends_on:
      starrocks-fe-be:
        condition: service_healthy
    ports:
      - "8040:8040"
      - "9050:9050"
      - "9060:9060"
    volumes:
      - be_storage:/opt/starrocks/be/storage
      - be_log:/opt/starrocks/be/log
    networks:
      - starrocks-net
      - rill-isolated-net
    command:
      - /bin/bash
      - -c
      - |
        sleep 15
        mysql --connect-timeout 2 -h starrocks-fe -P 9030 -u root -e "ALTER SYSTEM ADD BACKEND 'starrocks-be:9050';" || true
        /opt/starrocks/be/bin/start_be.sh
    restart: unless-stopped
    healthcheck:
      test: 'mysql -u root -p"starrocks_demo_pw1#" -h starrocks-fe -P 9030 -e "SHOW BACKENDS\G" 2>/dev/null |grep "Alive: true" || mysql -u root -h starrocks-fe -P 9030 -e "SHOW BACKENDS\G" |grep "Alive: true"'
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================
  # StarRocks Init (BE 모드 - 비밀번호 설정)
  # ===========================================
  starrocks-init-be:
    image: mysql:8.0
    container_name: starrocks-init-be
    profiles: ["be"]
    depends_on:
      starrocks-be:
        condition: service_healthy
    networks:
      - starrocks-net
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Setting StarRocks root password..."
        mysql -h starrocks-fe -P 9030 -u root -e "SET PASSWORD = PASSWORD('starrocks_demo_pw1#');" && \
        echo "StarRocks password set successfully." || \
        echo "Password may already be set."
    restart: "no"

  # ===========================================
  # StarRocks RBAC Init (BE 모드 - 역할/사용자 설정)
  # ===========================================
  starrocks-rbac-init-be:
    image: mysql:8.0
    container_name: starrocks-rbac-init-be
    profiles: ["be"]
    depends_on:
      starrocks-init-be:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - starrocks-net
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Waiting for analytics_db to be ready..."
        for i in $(seq 1 30); do
          if mysql -h starrocks-fe -P 9030 -u root -p'starrocks_demo_pw1#' -e "USE analytics_db" 2>/dev/null; then
            echo "analytics_db is ready."
            break
          fi
          echo "Attempt $$i/30: analytics_db not found. Retrying in 5s..."
          sleep 5
        done

        echo "Running RBAC initialization..."
        mysql -h starrocks-fe -P 9030 -u root -p'starrocks_demo_pw1#' < /scripts/starrocks-rbac-init.sql && \
        echo "RBAC initialization completed successfully." || \
        echo "RBAC initialization failed or already applied."
    restart: "no"

  # ===========================================
  # MinIO Upload (Rill 데모 - 샘플 데이터 업로드)
  # ===========================================
  minio-upload-rill:
    image: minio/mc:latest
    container_name: minio-upload-rill
    profiles: ["rill"]
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./data/sample:/sample_data:ro
    networks:
      - starrocks-net
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Uploading sample data to MinIO..."
        mc alias set myminio http://minio:9000 admin 'StarRocksDemo1!_minio'
        mc cp /sample_data/yellow_tripdata_2024-01.parquet myminio/sample-data/
        mc ls myminio/sample-data/
        echo "Upload complete!"
    restart: "no"

  # ===========================================
  # StarRocks Init (Rill 데모 - 테이블 생성 및 데이터 로드)
  # ===========================================
  starrocks-init-rill:
    image: starrocks/fe-ubuntu:3.5-latest
    container_name: starrocks-init-rill
    profiles: ["rill"]
    user: root
    depends_on:
      starrocks-be:
        condition: service_healthy
      minio-upload-rill:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/scripts:ro
      - ./data/sample:/sample_data:ro
    networks:
      - starrocks-net
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Creating tables..."
        mysql -h starrocks-fe -P 9030 -u root -p'starrocks_demo_pw1#' < /scripts/starrocks-rill-init.sql

        echo ""
        echo "Loading taxi zone lookup data via Stream Load..."
        curl --location-trusted -X PUT \
          -H "Expect:100-continue" \
          -H "label:taxi_zone_$(date +%s)" \
          -H "column_separator:," \
          -H "skip_header:1" \
          -T /sample_data/taxi_zone_lookup.csv \
          "http://starrocks-fe:8030/api/analytics_db/taxi_zone_lookup/_stream_load" \
          -u root:'starrocks_demo_pw1#'

        echo ""
        echo "Loading yellow taxi trips data from MinIO via FILES()..."
        mysql -h starrocks-fe -P 9030 -u root -p'starrocks_demo_pw1#' -e "
        INSERT INTO analytics_db.yellow_taxi_trips
        SELECT * FROM FILES(
            'path' = 's3://sample-data/yellow_tripdata_2024-01.parquet',
            'format' = 'parquet',
            'aws.s3.access_key' = 'admin',
            'aws.s3.secret_key' = 'StarRocksDemo1!_minio',
            'aws.s3.endpoint' = 'http://minio:9000',
            'aws.s3.enable_path_style_access' = 'true'
        );"

        echo ""
        echo "Verifying data..."
        mysql -h starrocks-fe -P 9030 -u root -p'starrocks_demo_pw1#' -e "SELECT COUNT(*) as zones FROM analytics_db.taxi_zone_lookup; SELECT COUNT(*) as trips FROM analytics_db.yellow_taxi_trips;"

        echo "Rill demo initialization complete!"
    restart: "no"

  # ===========================================
  # MinIO (CN 모드 및 Rill 데모용 S3 호환 스토리지)
  # ===========================================
  minio:
    image: minio/minio:latest
    container_name: minio
    profiles: ["cn", "rill"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: StarRocksDemo1!_minio
    entrypoint: sh
    command: '-c "mkdir -p /data/starrocks-bucket /data/sample-data && minio server /data --console-address :9001"'
    networks:
      - starrocks-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================
  # StarRocks Frontend - CN 모드 (Shared-Data)
  # ===========================================
  starrocks-fe-cn:
    image: starrocks/fe-ubuntu:3.5-latest
    hostname: starrocks-fe
    container_name: starrocks-fe
    profiles: ["cn"]
    user: root
    command:
      - /bin/bash
      - -c
      - |
        echo "# Shared-Data Mode Configuration" >> /opt/starrocks/fe/conf/fe.conf
        echo "run_mode = shared_data" >> /opt/starrocks/fe/conf/fe.conf
        echo "cloud_native_storage_type = S3" >> /opt/starrocks/fe/conf/fe.conf
        echo "aws_s3_endpoint = minio:9000" >> /opt/starrocks/fe/conf/fe.conf
        echo "aws_s3_path = starrocks-bucket/docker/db" >> /opt/starrocks/fe/conf/fe.conf
        echo "aws_s3_access_key = admin" >> /opt/starrocks/fe/conf/fe.conf
        echo "aws_s3_secret_key = StarRocksDemo1!_minio" >> /opt/starrocks/fe/conf/fe.conf
        echo "aws_s3_use_instance_profile = false" >> /opt/starrocks/fe/conf/fe.conf
        echo "aws_s3_use_aws_sdk_default_behavior = false" >> /opt/starrocks/fe/conf/fe.conf
        echo "aws_s3_use_path_style = true" >> /opt/starrocks/fe/conf/fe.conf
        echo "enable_load_volume_from_conf = true" >> /opt/starrocks/fe/conf/fe.conf
        /opt/starrocks/fe/bin/start_fe.sh --host_type FQDN
    ports:
      - "8030:8030"
      - "9020:9020"
      - "9030:9030"
    volumes:
      - fe_meta_cn:/opt/starrocks/fe/meta
      - fe_log_cn:/opt/starrocks/fe/log
    networks:
      - starrocks-net
      - rill-isolated-net
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: 'mysql -u root -p"starrocks_demo_pw1#" -h starrocks-fe -P 9030 -e "show frontends\G" 2>/dev/null |grep "Alive: true" || mysql -u root -h starrocks-fe -P 9030 -e "show frontends\G" |grep "Alive: true"'
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # ===========================================
  # StarRocks Compute Node (CN 모드 전용)
  # ===========================================
  starrocks-cn:
    image: starrocks/cn-ubuntu:3.5-latest
    hostname: starrocks-cn
    container_name: starrocks-cn
    profiles: ["cn"]
    user: root
    depends_on:
      starrocks-fe-cn:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8040:8040"
      - "9050:9050"
      - "9060:9060"
    volumes:
      - cn_log:/opt/starrocks/cn/log
    networks:
      - starrocks-net
      - rill-isolated-net
    environment:
      - HOST_TYPE=FQDN
    command:
      - /bin/bash
      - -c
      - |
        sleep 15
        ulimit -u 65535
        ulimit -n 65535
        mysql --connect-timeout 2 -h starrocks-fe -P 9030 -u root -e "ALTER SYSTEM ADD COMPUTE NODE 'starrocks-cn:9050';" || true
        /opt/starrocks/cn/bin/start_cn.sh
    restart: unless-stopped
    healthcheck:
      test: 'mysql -u root -p"starrocks_demo_pw1#" -h starrocks-fe -P 9030 -e "SHOW COMPUTE NODES\G" 2>/dev/null |grep "Alive: true" || mysql -u root -h starrocks-fe -P 9030 -e "SHOW COMPUTE NODES\G" |grep "Alive: true"'
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================
  # StarRocks Init (CN 모드 - 비밀번호 설정)
  # ===========================================
  starrocks-init-cn:
    image: mysql:8.0
    container_name: starrocks-init-cn
    profiles: ["cn"]
    depends_on:
      starrocks-cn:
        condition: service_healthy
    networks:
      - starrocks-net
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Setting StarRocks root password..."
        mysql -h starrocks-fe -P 9030 -u root -e "SET PASSWORD = PASSWORD('starrocks_demo_pw1#');" && \
        echo "StarRocks password set successfully." || \
        echo "Password may already be set."
    restart: "no"

  # ===========================================
  # StarRocks RBAC Init (CN 모드 - 역할/사용자 설정)
  # ===========================================
  starrocks-rbac-init-cn:
    image: mysql:8.0
    container_name: starrocks-rbac-init-cn
    profiles: ["cn"]
    depends_on:
      starrocks-init-cn:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - starrocks-net
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Waiting for analytics_db to be ready..."
        for i in $(seq 1 30); do
          if mysql -h starrocks-fe -P 9030 -u root -p'starrocks_demo_pw1#' -e "USE analytics_db" 2>/dev/null; then
            echo "analytics_db is ready."
            break
          fi
          echo "Attempt $$i/30: analytics_db not found. Retrying in 5s..."
          sleep 5
        done

        echo "Running RBAC initialization..."
        mysql -h starrocks-fe -P 9030 -u root -p'starrocks_demo_pw1#' < /scripts/starrocks-rbac-init.sql && \
        echo "RBAC initialization completed successfully." || \
        echo "RBAC initialization failed or already applied."
    restart: "no"

  # ===========================================
  # Flink CDC (실시간 CDC 모드)
  # ===========================================
  flink-jobmanager:
    build:
      context: ./cdc/flink
      dockerfile: Dockerfile
    container_name: flink-jobmanager
    profiles: ["flink"]
    hostname: flink-jobmanager
    ports:
      - "8082:8081"
    command: jobmanager
    volumes:
      - ./cdc/flink/pipelines:/opt/flink-cdc/pipelines:ro
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        execution.checkpointing.interval: 3000
    networks:
      - starrocks-net
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  flink-taskmanager:
    build:
      context: ./cdc/flink
      dockerfile: Dockerfile
    container_name: flink-taskmanager
    profiles: ["flink"]
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    networks:
      - starrocks-net
    depends_on:
      - flink-jobmanager
    restart: unless-stopped

  # ===========================================
  # RisingWave CDC (실시간 스트리밍 CDC)
  # ===========================================
  risingwave:
    image: risingwavelabs/risingwave:latest
    container_name: risingwave
    profiles: ["risingwave"]
    hostname: risingwave
    command: single_node
    ports:
      - "4566:4566"   # PostgreSQL 프로토콜 (SQL 인터페이스)
      - "5691:5691"   # Web Dashboard
    volumes:
      - risingwave_data:/risingwave/state_store
      - ./cdc/risingwave:/risingwave-cdc:ro
    networks:
      - starrocks-net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "psql", "-h", "localhost", "-p", "4566", "-U", "root", "-d", "dev", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ===========================================
  # Rill BI Dashboard (네트워크 격리)
  # ===========================================
  rill:
    image: kjjs1996/rilldata-starrocks-dev:0.79.5
    container_name: rill
    hostname: rill
    profiles: ["rill"]
    user: root
    depends_on:
      starrocks-init-rill:
        condition: service_completed_successfully
    volumes:
      - rill_data:/home/rill/.rill
      - ./bi/rill-project:/home/rill/project:rw
    working_dir: /home/rill/project
    command: ["start", "--no-open"]
    environment:
      - RILL_DATABASE_DSN=starrocks://root:starrocks_demo_pw1%23@starrocks-fe:9030/analytics_db
    networks:
      - rill-isolated-net  # 격리 네트워크만 연결
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9009/"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  # ===========================================
  # Nginx Reverse Proxy (Rill 외부 접근용)
  # ===========================================
  rill-proxy:
    image: nginx:alpine
    container_name: rill-proxy
    profiles: ["rill"]
    ports:
      - "9010:9009"
    volumes:
      - ./config/nginx/rill-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - starrocks-net       # 외부 접근용
      - rill-isolated-net   # Rill 연결용
    depends_on:
      - rill
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9009/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  starrocks-net:
    driver: bridge
  rill-isolated-net:
    driver: bridge
    internal: true  # 외부 인터넷 차단

volumes:
  mysql_data:
  fe_meta:
  fe_log:
  fe_meta_cn:
  fe_log_cn:
  be_storage:
  be_log:
  cn_log:
  minio_data:
  risingwave_data:
  rill_data:
